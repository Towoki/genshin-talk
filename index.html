<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原神トークテーマルーレット</title>

    <!-- PWA / スマホのホーム画面用設定 ＆ ファビコン -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e1e2f">

    <style>
        body {
            font-family: sans-serif;
            background-color: #1e1e2f;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ffd700;
        }
        .card {
            background-color: #2b2b40;
            border: 2px solid #4a4a75;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            padding: 24px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            box-sizing: border-box;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .theme-item {
            padding: 12px 16px;
            margin: 10px 0;
            background-color: #383854;
            border-radius: 8px;
            font-size: 1rem;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .theme-item:hover {
            background-color: #424266;
            border-color: #6a6a99;
        }
        /* ハイライト（枠線と背景色のみ） */
        .theme-item.highlight {
            background-color: #4a3b1c;
            border-color: #ffd700;
            color: #ffd700;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        .number {
            display: inline-block;
            width: 24px;
            text-align: center;
            margin-right: 8px;
            opacity: 0.8;
        }
        .btn-container {
            margin-top: 24px;
            text-align: center;
        }
        button {
            background-color: #ffd700;
            color: #1e1e2f;
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }
        button:hover {
            background-color: #ffea70;
        }
        button:disabled {
            background-color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }
        /* ストップ中のボタンの見た目（赤系に変える例） */
        button.stop-mode {
            background-color: #ff4d4d;
            color: #fff;
            box-shadow: 0 4px 10px rgba(255, 77, 77, 0.3);
        }
        button.stop-mode:hover {
            background-color: #ff6b6b;
        }
        .hint {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
            padding: 0 20px;
            line-height: 1.4;
        }
        .loading {
            text-align: center;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>原神トークテーマルーレット</h1>

    <div class="card" id="cardContainer">
        <div class="loading" id="loadingText">スプレッドシートからデータを取得中...</div>
    </div>

    <div class="btn-container">
        <!-- スタート/ストップを兼ねたボタンに変更 -->
        <button id="rouletteButton" onclick="toggleRoulette()" disabled>スタート</button>
    </div>

    <div class="hint">
        ※金色に光るお題が現在のお題です。<br>他のお題をタップして切り替えることもできます。
    </div>

    <script>
        // ★ここにGASのウェブアプリURLが入っています★
        const apiUrl = "https://script.google.com/macros/s/AKfycbx6xh1C1aJ_W2z2hJKU32Zy95OFeNBmBWhleamR3i-znclkhAIwaPVB8-ZgHLi53MmJ/exec";

        let categoryData = {};
        let currentSelectedThemes = [];
        let currentHighlightIndex = 0;

        // ルーレット用の変数
        let isRolling = false;
        let rollInterval = null;

        // データ取得関数
        async function fetchThemes() {
            try {
                const response = await fetch(apiUrl);
                categoryData = await response.json();
                
                const categories = Object.keys(categoryData);
                if (categories.length < 4) {
                    document.getElementById("loadingText").innerText = "有効なカテゴリが4つ以上見つかりません。スプレッドシートを確認してください。";
                    return;
                }

                document.getElementById("rouletteButton").disabled = false;
                // 初回は自動で1回分を確定表示しておく
                executeDrawLogic();
                renderCard();

            } catch (error) {
                console.error("データの取得に失敗しました:", error);
                document.getElementById("loadingText").innerText = "データの読み込みに失敗しました。URLを確認してください。";
            }
        }

        // ボタンが押されたときの処理（スタート / ストップのトグル）
        function toggleRoulette() {
            const categories = Object.keys(categoryData);
            if (categories.length < 4) return;

            const btn = document.getElementById("rouletteButton");

            if (!isRolling) {
                // --- 【スタート】ジャラララと回し始める ---
                isRolling = true;
                btn.textContent = "ストップ！";
                btn.classList.add("stop-mode");

                // 一定間隔（0.05秒おき）にシャッフル表示を繰り返す
                rollInterval = setInterval(() => {
                    executeDrawLogic();
                    renderCard();
                }, 50);

            } else {
                // --- 【ストップ】ピタッと止める ---
                isRolling = false;
                clearInterval(rollInterval);

                // 最終結果をもう一度しっかり計算して確定
                executeDrawLogic();
                renderCard();

                btn.textContent = "スタート";
                btn.classList.remove("stop-mode");
            }
        }

        // 抽選の計算処理（ランダムに4つ選ぶ）
        function executeDrawLogic() {
            const categories = Object.keys(categoryData);
            
            // 1. カテゴリをランダムに4つ選ぶ（重複なし）
            const shuffledCategories = [...categories].sort(() => 0.5 - Math.random());
            const selectedCategories = shuffledCategories.slice(0, 4);

            // 2. 選ばれた各カテゴリから、ワードをランダムに1つずつ選ぶ
            currentSelectedThemes = selectedCategories.map(cat => {
                const words = categoryData[cat];
                const randomWord = words[Math.floor(Math.random() * words.length)];
                return randomWord;
            });

            // 3. 4つのうちどれか1つをハイライトに決定
            currentHighlightIndex = Math.floor(Math.random() * 4);
        }

        // 画面を描画する関数
        function renderCard() {
            const container = document.getElementById("cardContainer");
            container.innerHTML = "";

            currentSelectedThemes.forEach((theme, index) => {
                const item = document.createElement("div");
                item.className = "theme-item";
                
                if (index === currentHighlightIndex) {
                    item.classList.add("highlight");
                }
                
                item.innerHTML = `<span class="number">[${index + 1}]</span>${theme}`;

                // タップでハイライト移動（ルーレット中は誤作動防止で無効化）
                item.onclick = () => {
                    if (isRolling) return;
                    currentHighlightIndex = index;
                    renderCard();
                };
                
                container.appendChild(item);
            });
        }

        fetchThemes();
    </script>

</body>
</html>
