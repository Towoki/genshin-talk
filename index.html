<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原神トークテーマルーレット</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e1e2f">

    <style>
        body {
            font-family: sans-serif;
            background-color: #1e1e2f;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #ffd700;
        }
        .theme-counter {
            font-size: 0.85rem;
            color: #8a8aab;
            margin-bottom: 20px;
            text-align: center;
        }
        /* 枠の高さを固定してボタンの座標ズレを防止 */
        .card {
            background-color: #2b2b40;
            border: 2px solid #4a4a75;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            height: 310px;
            padding: 20px 24px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card.has-items {
            justify-content: space-between;
        }
        .theme-item {
            padding: 10px 14px;
            margin: 4px 0;
            background-color: #383854;
            border-radius: 8px;
            font-size: 0.95rem;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .theme-item:hover {
            background-color: #424266;
            border-color: #6a6a99;
        }
        .theme-item.highlight {
            background-color: #4a3b1c;
            border-color: #ffd700;
            color: #ffd700;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        .number {
            display: inline-block;
            width: 24px;
            text-align: center;
            margin-right: 8px;
            opacity: 0.8;
        }
        .btn-container {
            margin-top: 24px;
            text-align: center;
        }
        button {
            background-color: #ffd700;
            color: #1e1e2f;
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }
        button:hover {
            background-color: #ffea70;
        }
        button:disabled {
            background-color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }
        button.stop-mode {
            background-color: #ff4d4d;
            color: #fff;
            box-shadow: 0 4px 10px rgba(255, 77, 77, 0.3);
        }
        button.stop-mode:hover {
            background-color: #ff6b6b;
        }
        .hint {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
            padding: 0 20px;
            line-height: 1.4;
            min-height: 2.8em;
            visibility: hidden;
        }
        .hint.visible {
            visibility: visible;
        }
        .loading {
            text-align: center;
            color: #aaa;
            line-height: 1.6;
        }
        .ready-text {
            text-align: center;
            color: #ffd700;
            font-weight: bold;
            font-size: 1.05rem;
            line-height: 1.6;
        }
        .footer {
            margin-top: 32px;
            font-size: 0.75rem;
            color: #555577;
            text-align: center;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <h1>原神トークテーマルーレット</h1>
    <div class="theme-counter" id="themeCounter">データ取得中…</div>

    <div class="card" id="cardContainer">
        <div class="loading" id="loadingText">データ取得中…</div>
    </div>

    <div class="btn-container">
        <button id="rouletteButton" onclick="toggleRoulette()" disabled>スタート</button>
    </div>

    <div class="hint" id="hintText">
        ※金色に光るお題についてお話しください。<br>他のお題をタップして切り替えることもできます。
    </div>

    <div class="footer">
        製作：トヲキ（UID：1801575238）
    </div>

    <script>
        const apiUrl = "https://script.google.com/macros/s/AKfycbx6xh1C1aJ_W2z2hJKU32Zy95OFeNBmBWhleamR3i-znclkhAIwaPVB8-ZgHLi53MmJ/exec";

        let categoryData = {};
        let currentSelectedThemes = [];
        let currentHighlightIndex = 0;

        let isRolling = false;
        let rollInterval = null;

        async function fetchThemes() {
            try {
                const response = await fetch(apiUrl);
                categoryData = await response.json();
                
                const categories = Object.keys(categoryData);
                if (categories.length < 4) {
                    document.getElementById("loadingText").innerText = "有効なカテゴリが4つ以上見つかりません。";
                    return;
                }

                let totalThemes = 0;
                Object.values(categoryData).forEach(words => {
                    totalThemes += words.length;
                });
                document.getElementById("themeCounter").innerText = `収録ワード数: ${totalThemes}件`;

                document.getElementById("rouletteButton").disabled = false;

                const loadingEl = document.getElementById("loadingText");
                loadingEl.className = "ready-text";
                loadingEl.innerHTML = "準備完了！<br>「スタート」を押してルーレットを回してください";

            } catch (error) {
                console.error("データの取得に失敗しました:", error);
                document.getElementById("loadingText").innerText = "データの読み込みに失敗しました。";
            }
        }

        function toggleRoulette() {
            const categories = Object.keys(categoryData);
            if (categories.length < 4) return;

            const btn = document.getElementById("rouletteButton");

            if (!isRolling) {
                isRolling = true;
                btn.textContent = "ストップ！";
                btn.classList.add("stop-mode");

                rollInterval = setInterval(() => {
                    executeDrawLogic();
                    renderCard();
                }, 50);

            } else {
                isRolling = false;
                clearInterval(rollInterval);

                executeDrawLogic();
                renderCard();

                btn.textContent = "スタート";
                btn.classList.remove("stop-mode");
                document.getElementById("hintText").classList.add("visible");
            }
        }

        function executeDrawLogic() {
            const categories = Object.keys(categoryData);
            
            const shuffledCategories = [...categories].sort(() => 0.5 - Math.random());
            const selectedCategories = shuffledCategories.slice(0, 4);

            currentSelectedThemes = selectedCategories.map(cat => {
                const words = categoryData[cat];
                return words[Math.floor(Math.random() * words.length)];
            });

            currentHighlightIndex = Math.floor(Math.random() * 4);
        }

        function renderCard() {
            const container = document.getElementById("cardContainer");
            container.classList.add("has-items");
            container.innerHTML = "";

            currentSelectedThemes.forEach((theme, index) => {
                const item = document.createElement("div");
                item.className = "theme-item";
                
                if (index === currentHighlightIndex) {
                    item.classList.add("highlight");
                }
                
                item.innerHTML = `<span class="number">[${index + 1}]</span>${theme}`;

                item.onclick = () => {
                    if (isRolling) return;
                    currentHighlightIndex = index;
                    renderCard();
                };
                
                container.appendChild(item);
            });
        }

        fetchThemes();
    </script>

</body>
</html>
